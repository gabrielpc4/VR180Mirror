<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR180 Spectator</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0d10; color: #e8eaed;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; gap: 16px; padding: 20px;
  }
  h1 { font-size: 1.15rem; font-weight: 600; margin-top: 4px; letter-spacing: .3px; }
  h1 .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: #666; margin-right: 8px; transition: background .3s; }
  h1 .dot.live { background: #34c759; box-shadow: 0 0 8px #34c75988; }
  #video-wrap { width: min(96vw, 1100px); aspect-ratio: 2 / 1; background: #000;
    border: 1px solid #26292e; border-radius: 10px; overflow: hidden; position: relative; }
  video { width: 100%; height: 100%; object-fit: contain; }
  /* direct-decode mode: the element carries audio only, so the preview is
     drawn from the decoded frames */
  #preview { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: #000a; backdrop-filter: blur(2px); }
  #overlay.hidden { display: none; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: #2a6df4;
    border: 0; border-radius: 10px; padding: 14px 26px; cursor: pointer;
    font-size: 1.05rem;
  }
  button:disabled { background: #333; color: #888; }
  button.big { font-size: 1.3rem; padding: 18px 40px; }
  #enter-vr { background: #7b2af4; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
  #status { color: #9aa0a6; font-size: .95rem; min-height: 1.2em; text-align: center; }
  label.chk { display: flex; gap: 8px; align-items: center; color: #c6cad1; font-size: .95rem;
    background: #16181c; padding: 10px 14px; border-radius: 10px; border: 1px solid #26292e;
    cursor: pointer; user-select: none; }
  #stats { color: #6f757d; font-size: .8rem; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <h1><span id="dot" class="dot"></span>VR180 Spectator — live view of the player's headset</h1>

  <div id="video-wrap">
    <video id="video" playsinline muted></video>
    <canvas id="preview" width="1024" height="512"></canvas>
    <div id="overlay">
      <button id="connect" class="big">▶ Connect to stream</button>
      <div id="status">Not connected</div>
    </div>
  </div>

  <div class="row">
    <label class="chk"><input type="radio" name="mode" id="mode-buf" checked> Max resolution (buffered ~2-4s)</label>
    <label class="chk"><input type="radio" name="mode" id="mode-rtc"> Low latency (WebRTC, H264 only)</label>
  </div>

  <div class="row">
    <button id="enter-vr" disabled>🥽 Enter VR (180° immersive)</button>
    <label class="chk"><input type="checkbox" id="headlock"> Hard-lock to player's view (no free look)</label>
    <label class="chk"><input type="checkbox" id="muted" checked> Muted</label>
    <label class="chk" title="Removes the soft fade at the image border so the full rendered picture is visible. Any rounded corners that remain come from the game itself (pixels behind the lens mask are never rendered)."><input type="checkbox" id="fullpic"> Full picture (no edge softening)</label>
    <label class="chk" title="Buffers ~1.5s so every frame plays at a constant 72fps even through hiccups — frames are delayed, never skipped. Adds latency."><input type="checkbox" id="delaypref"> Prefer delaying over skipping</label>
    <label class="chk" title="Live diagnostics panel at the center of view in VR: XR fps, video fps, drops, buffer, and the headset's GPU/CPU telemetry."><input type="checkbox" id="hud" checked> Show stats HUD in VR</label>
  </div>
  <div id="status2" style="color:#9aa0a6;font-size:.95rem"></div>
  <div id="stats"></div>
  <div id="cap" style="color:#6f757d;font-size:.8rem"></div>
  <div id="errline" style="color:#ff6b6b;font-size:.9rem;max-width:min(96vw,1100px);text-align:center"></div>

<script src="hls.min.js"></script>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
const video = $("video");
const statusEl = $("status");
const status2El = $("status2");

let pc = null;
let hls = null;
let whepLocation = null;
let xrSession = null;
let connected = false;
let fallbackTimer = null;

function setStatus(t) { statusEl.textContent = t; status2El.textContent = t; }

// The viewer runs inside the headset, so anything that goes wrong there used to
// be invisible. Every problem now shows up in three places: this page, the VR
// HUD, and the web server's console window on the PC (plus web/client.log).
let lastReport = "", lastReportAt = 0;
function report(msg) {
  const text = String(msg).slice(0, 300);
  window.__wcErr = text;
  const el = $("errline");
  if (el) el.textContent = "⚠ " + text;
  const now = Date.now();
  if (text === lastReport && now - lastReportAt < 10000) return;   // do not spam
  lastReport = text; lastReportAt = now;
  try {
    fetch(new URL("/clientlog", location.href),
          { method: "POST", body: text, keepalive: true }).catch(() => {});
  } catch (e) {}
}
window.addEventListener("error", (e) => report("js: " + (e.message || e)));
window.addEventListener("unhandledrejection", (e) =>
  report("promise: " + ((e.reason && e.reason.message) || e.reason)));

function teardownTransports() {
  if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  wc.reset();
  video.srcObject = null;
  video.removeAttribute("src");
}

// universal "we have frames" signal for both transports
video.addEventListener("playing", () => {
  connected = true;
  $("dot").classList.add("live");
  $("overlay").classList.add("hidden");
  updateVRButton();
});

// ------------------------------------------------- WebCodecs sideband decoder
// The Quest browser's video-to-GL acquisition is broken for MSE/WebRTC-backed
// elements (measured: 0.7 distinct frames/s reach GL while the element
// presents 72). So in VR we decode the video track OURSELVES: hls.js hands us
// the raw fMP4 chunks (BUFFER_APPENDING) -> mp4box demuxes -> VideoDecoder
// (hardware) -> GPU-backed VideoFrames -> the dome texture. The muted-audio
// clock of the element still drives A/V sync.
const wc = {
  active: false, worker: null, queue: [], primed: false, pendingDepth: 0,
  outPerSec: 0, _outCount: 0, dispPerSec: 0, _dispCount: 0,
  discPerSec: 0, _discCount: 0, heldPerSec: 0, _heldCount: 0, direct: false,
  // Pacing is a plain jitter buffer, NOT a clock comparison: the source is
  // 72fps and the XR loop is ~72fps, so display one frame per XR frame and let
  // the worker decode exactly as fast as we consume (credit per frame).
  // Depths are deliberately tiny: one decoded 4096x2048 frame is ~12.6MB, so a
  // deep queue trips Android's low-memory killer (observed: the tab reloading
  // itself mid-session) and causes GC hitches.
  DEPTH_PRIME: 2,       // frames to have in hand before the first is shown
  BACKLOG_DRIFT: 170,   // undecoded chunks (~2.4s) that mean we are behind
  CATCHUP_EVERY: 8,     // while behind, shed 1 frame per this many shown (~9/s)
  _catchup: 0,
  reset() {
    if (this.worker) {
      try { this.worker.postMessage({ type: "reset" }); this.worker.terminate(); } catch (e) {}
      this.worker = null;
    }
    for (const f of this.queue) { try { f.close(); } catch (e) {} }
    this.queue = []; this.active = false; this.primed = false; this.pendingDepth = 0;
    this.direct = false;
  },
  ensureWorker() {
    if (this.worker) return;
    // cache-bust: the browser was holding an old copy of the worker script,
    // so fixes shipped in it never ran (the page reload does not refetch it)
    this.worker = new Worker("wcworker.js?v=" + Date.now());
    this.worker.onerror = (e) => report("worker: " + e.message);
    this.worker.onmessage = (e) => {
      const m = e.data;
      if (m.type === "frame") {
        this._outCount++;
        this.queue.push(m.frame);
        // Even rate matching: when the worker decodes ahead of us (it does that
        // deliberately while a backlog exists), shed the oldest frame here -
        // one frame at a time, which is invisible, instead of letting the
        // backlog grow into a visible jump.
        while (this.queue.length > 5) {
          const f = this.queue.shift();
          this._discCount++;
          try { f.close(); } catch (err) {}
          if (this.worker) this.worker.postMessage({ type: "credit", n: 1 });
        }
        if (!connected) {                    // first frames: we are live
          connected = true;
          $("dot").classList.add("live");
          $("overlay").classList.add("hidden");
          updateVRButton();
          setStatus("Live - max resolution (direct decode)");
        }
      } else if (m.type === "ready") {
        this.active = true;
        this.w = m.w; this.h = m.h;
      } else if (m.type === "depth") {
        this.pendingDepth = m.pending;
      } else if (m.type === "direct-failed") {
        report("direct fetch failed: " + m.msg);
        if (this.direct) { this.direct = false; this.reset(); hlsMseConnect().catch(() => {}); }
      } else if (m.type === "log") {
        // informational lines (e.g. the chosen variant) are not failures
        if (/error|fail|append|decode:|configure|reset/i.test(m.msg)) report(m.msg);
        else window.__wcErr = m.msg;
      }
    };
    this.worker.postMessage({ type: "credit", n: 5 });   // prime the pipeline
  },
  feed(chunk) {                       // Uint8Array fMP4 bytes from hls.js
    if (!window.VideoDecoder) return;
    this.ensureWorker();
    // hls.js reuses its buffers, so copy once (a memcpy, ~2ms for 18MB) and
    // transfer ownership to the worker - the 35-41ms demux happens there.
    const copy = chunk.slice();
    this.worker.postMessage({ type: "data", buf: copy.buffer }, [copy.buffer]);
  },
  pump() { /* the worker paces itself from display credits */ },
  // One frame per call (i.e. per XR frame), in decode order. The caller closes
  // the frame right after uploading it, so nothing is retained.
  // Rate matching: the source is 72fps and the XR loop is ~72fps but not
  // exactly, so error would accumulate into a periodic hitch. Instead, when
  // the queue drifts deep we consume two frames in one XR frame (a single
  // 14ms skip, imperceptible) and when it runs dry we simply hold the last
  // frame. Corrections stay small and constant instead of rare and visible.
  pick() {
    if (!this.queue.length) { if (this.primed) this._heldCount++; return null; }
    if (!this.primed) {
      if (this.queue.length < this.DEPTH_PRIME) return null;
      this.primed = true;
    }
    // Gentle catch-up: while an undecoded backlog persists (we are consuming
    // slower than the source produces), shed one extra frame every few frames.
    // That is a 14ms step, invisible, and it drains the backlog steadily
    // instead of letting it grow until something skips a whole second.
    if (this.pendingDepth > this.BACKLOG_DRIFT && this.queue.length > 1) {
      if (++this._catchup >= this.CATCHUP_EVERY) {
        this._catchup = 0;
        const stale = this.queue.shift();
        this._discCount++;
        try { stale.close(); } catch (e) {}
        if (this.worker) this.worker.postMessage({ type: "credit", n: 1 });
      }
    } else {
      this._catchup = 0;
    }
    const f = this.queue.shift();
    this._dispCount++;
    if (this.worker) this.worker.postMessage({ type: "credit", n: 1 });
    return f;
  },
};
setInterval(() => {
  // Watchdog: decoding is credit-paced (one credit per frame consumed or shed),
  // so an empty queue means no credits, which means no decoding - a deadlock
  // that shows up as "dec 0/s, held 72/s" with the backlog still growing.
  // Any starvation while chunks are waiting gets a small top-up.
  if (wc.active && wc.queue.length === 0 && wc.pendingDepth > 0 && wc.worker) {
    wc.worker.postMessage({ type: "credit", n: 3 });
  }
  wc.outPerSec = wc._outCount * 2; wc._outCount = 0;
  wc.dispPerSec = wc._dispCount * 2; wc._dispCount = 0;
  wc.discPerSec = wc._discCount * 2; wc._discCount = 0;
  wc.heldPerSec = wc._heldCount * 2; wc._heldCount = 0;
  if (wc.active) wc.pump();   // backup pump outside XR
}, 500);

// ------------------------------------------------------------- buffered (MSE)
// hls.js -> MSE -> the browser's hardware video pipeline (the path Meta
// documents as 8K-capable for HEVC/AV1) reading MediaMTX LL-HLS via our proxy.
// Preferred buffered path: the worker fetches + decodes the video rendition
// directly (no MSE, no second decode of the same stream), and the media element
// carries the audio rendition only.
async function bufferedConnect() {
  const master = new URL("/hls/index.m3u8", location.href).href;
  if (window.VideoDecoder && window.Worker) {
    wc.reset();
    wc.ensureWorker();
    wc.direct = true;
    wc.worker.postMessage({ type: "direct", url: master });
    setStatus("Starting max-resolution video (direct decode)…");
    audioOnlyConnect(master).catch(() => {});   // optional, never fatal
    return;
  }
  return hlsMseConnect();
}

// Audio rendition only: MediaMTX publishes audio as a separate HLS rendition,
// so we can keep sound without the element touching the 4K video track.
async function audioOnlyConnect(masterUrl) {
  if (!window.Hls || !Hls.isSupported()) return;
  const txt = await (await fetch(masterUrl, { cache: "no-store" })).text();
  const m = txt.match(/#EXT-X-MEDIA:TYPE=AUDIO[^\n]*URI="([^"]+)"/);
  if (!m) return;
  const audioUrl = new URL(m[1], masterUrl).href;
  hls = new Hls({ lowLatencyMode: true, backBufferLength: 4, maxBufferLength: 6 });
  hls.loadSource(audioUrl);
  hls.attachMedia(video);
  video.muted = $("muted").checked;
  video.play().catch(() => {});
}

// Legacy fallback: full MSE playback (also feeds the worker from hls.js chunks).
async function hlsMseConnect() {
  if (!window.Hls || !Hls.isSupported()) {
    throw new Error("MSE not supported in this browser");
  }
  hls = new Hls({
    lowLatencyMode: true,
    backBufferLength: 4,
    maxBufferLength: 6,
    liveSyncDurationCount: 2,
    maxLiveSyncPlaybackRate: 1.05,
  });
  hls.on(Hls.Events.ERROR, (e, data) => {
    if (data && data.fatal) {
      setStatus("Stream error: " + data.details + " — Reconnect to retry");
      $("connect").textContent = "▶ Reconnect";
      $("connect").disabled = false;
      $("overlay").classList.remove("hidden");
    }
  });
  // sideband: raw fMP4 video chunks -> WebCodecs (see wc above)
  hls.on(Hls.Events.BUFFER_APPENDING, (e, data) => {
    if (data && (data.type === "video" || data.type === "audiovideo") && data.data) {
      wc.feed(data.data);
    }
  });
  hls.loadSource(new URL("/hls/index.m3u8", location.href).href);
  hls.attachMedia(video);
  setStatus("Buffering max-resolution stream…");
}

// ---------------------------------------------------------------- WHEP client
async function whepConnect() {
  const whepUrl = new URL("/whep", location.href).href;
  pc = new RTCPeerConnection();
  pc.addTransceiver("video", { direction: "recvonly" });
  pc.addTransceiver("audio", { direction: "recvonly" });

  const stream = new MediaStream();
  pc.ontrack = (ev) => {
    stream.addTrack(ev.track);
    if (video.srcObject !== stream) video.srcObject = stream;
    applyDelayPref();
  };
  pc.onconnectionstatechange = () => {
    setStatus("WebRTC: " + pc.connectionState);
    $("dot").classList.toggle("live", pc.connectionState === "connected");
    if (pc.connectionState === "connected") {
      connected = true;
      $("overlay").classList.add("hidden");
      updateVRButton();
    }
    if (["failed", "disconnected", "closed"].includes(pc.connectionState)) {
      connected = false;
      $("overlay").classList.remove("hidden");
      $("connect").textContent = "▶ Reconnect";
      $("connect").disabled = false;
      updateVRButton();
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await new Promise((res) => {
    if (pc.iceGatheringState === "complete") return res();
    const chk = () => { if (pc.iceGatheringState === "complete") { pc.removeEventListener("icegatheringstatechange", chk); res(); } };
    pc.addEventListener("icegatheringstatechange", chk);
    setTimeout(res, 1500);
  });

  const resp = await fetch(whepUrl, {
    method: "POST",
    headers: { "Content-Type": "application/sdp" },
    body: pc.localDescription.sdp,
  });
  if (!resp.ok && resp.status !== 201) throw new Error("WHEP POST failed: " + resp.status);
  whepLocation = resp.headers.get("Location");
  let answer = await resp.text();
  // USB mode: page served via adb-reverse on localhost. Keep only loopback ICE
  // candidates so the media is forced through the USB tunnel instead of Wi-Fi.
  if (["localhost", "127.0.0.1"].includes(location.hostname)) {
    answer = answer.split("\r\n").filter((l) =>
      !l.startsWith("a=candidate:") || l.includes("127.0.0.1")).join("\r\n");
  }
  await pc.setRemoteDescription({ type: "answer", sdp: answer });
}

$("connect").addEventListener("click", async () => {
  $("connect").disabled = true;
  setStatus("Connecting…");
  teardownTransports();
  try {
    if ($("mode-rtc").checked) {
      await whepConnect();
      // if WebRTC connects but never decodes (unsupported codec / software
      // decoder), fall back to the buffered hardware path automatically
      fallbackTimer = setTimeout(async () => {
        if (!video.videoWidth || video.readyState < 2) {
          setStatus("WebRTC can't decode this stream — switching to buffered mode…");
          teardownTransports();
          $("mode-buf").checked = true;
          try { await bufferedConnect(); } catch (e) { setStatus("Fallback failed: " + e.message); }
          video.muted = $("muted").checked;
          video.play().catch(() => {});
        }
      }, 5000);
    } else {
      await bufferedConnect();
    }
    video.muted = $("muted").checked;
    await video.play().catch(() => {});
  } catch (e) {
    setStatus("Failed: " + e.message + " — is the PC pipeline running?");
    $("connect").disabled = false;
  }
});

// pick the right default mode for the stream's codec (H264 = WebRTC capable;
// HEVC/AV1 = buffered hardware path)
fetch(new URL("/info", location.href)).then((r) => r.json()).then((i) => {
  const tracks = (i.tracks || []).join(",");
  const rtcOk = tracks.includes("H264");
  $("mode-rtc").checked = rtcOk;
  $("mode-buf").checked = !rtcOk;
  status2El.textContent = "Stream: " + tracks + (i.ready ? " (live)" : " (waiting)");
}).catch(() => {});

$("muted").addEventListener("change", () => { video.muted = $("muted").checked; });

// ---------------------------------------------------------------- WebXR VR180
const XR_HAVE = "xr" in navigator;

async function updateVRButton() {
  const btn = $("enter-vr");
  if (!XR_HAVE) {
    btn.textContent = window.isSecureContext
      ? "WebXR not available in this browser"
      : "WebXR blocked: page not a secure context";
    btn.disabled = true;
    return;
  }
  const ok = await navigator.xr.isSessionSupported("immersive-vr").catch(() => false);
  btn.disabled = !(ok && connected);
  btn.textContent = ok ? "🥽 Enter VR (180° immersive)" : "immersive-vr not supported here";
}
updateVRButton();

// The stream's angular coverage: full 180 classic, or the FOV-fit span
// published by the PC (packs the whole canvas with rendered pixels).
async function fetchSpans() {
  try {
    const i = await (await fetch(new URL("/info", location.href))).json();
    if (i.hspan > 10 && i.vspan > 10) {
      return { h: i.hspan * Math.PI / 180, v: i.vspan * Math.PI / 180 };
    }
  } catch (e) {}
  return { h: Math.PI, v: Math.PI };
}

// 2D preview: outside an XR session, consume frames here so the pipeline keeps
// flowing and the flat preview still shows the stream (the element has no video
// track in direct mode). Consumes at the source rate - throttling it to half
// rate made the backlog (and the latency) climb until a skip yanked it back.
{
  const pv = $("preview");
  const pctx = pv.getContext("2d");
  const loop = () => {
    requestAnimationFrame(loop);
    if (xrSession || !wc.active) return;
    const f = wc.pick();
    if (f) {
      try { pctx.drawImage(f, 0, 0, pv.width, pv.height); } catch (e) {}
      try { f.close(); } catch (e) {}
    }
  };
  requestAnimationFrame(loop);
}

// live metrics shared with the HUD
const live = { xrFps: 0, vidFps: 0, dropPs: 0, buf: 0, dev: {} };
setInterval(async () => {
  try { live.dev = await (await fetch(new URL("/devstats", location.href))).json(); } catch (e) {}
}, 1000);

function mat4mul(a, b) {           // column-major, out = a*b
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  }
  return o;
}

$("enter-vr").addEventListener("click", async () => {
  if (xrSession) { xrSession.end(); return; }
  try {
    xrSession = await navigator.xr.requestSession("immersive-vr", {
      optionalFeatures: ["local-floor"],
    });
  } catch (e) {
    setStatus("XR session failed: " + e.message);
    return;
  }
  $("enter-vr").textContent = "Exit VR";

  // Match the headset compositor to the 72 fps stream: no 72-in-90 pulldown judder.
  if (xrSession.supportedFrameRates && xrSession.updateTargetFrameRate) {
    const rates = Array.from(xrSession.supportedFrameRates);
    if (rates.includes(72)) xrSession.updateTargetFrameRate(72).catch(() => {});
  }

  xrSession.addEventListener("end", () => {
    xrSession = null;
    $("enter-vr").textContent = "🥽 Enter VR (180° immersive)";
    updateVRButton();
  });

  try {
    await runGlDome();
  } catch (e) {
    window.__xrErr = String(e && e.stack || e);
    setStatus("VR renderer failed: " + e.message);
    try { xrSession.end(); } catch (e2) {}
  }
});

// WebGL dome renderer: draws the video straight into the XR framebuffer each
// frame (classic XRWebGLLayer). Replaces XRMediaBinding, whose video-frame
// import path proved broken on Quest (fresh frames decoded at 72 but the
// layer displayed ~10fps of stale content). Also draws the stats HUD.
async function runGlDome() {
  const refSpace = await xrSession.requestReferenceSpace("local");
  let spans = await fetchSpans();

  const canvas = document.createElement("canvas");
  const gl = canvas.getContext("webgl2", {
    xrCompatible: true, antialias: false, depth: false, alpha: false,
    powerPreference: "high-performance", desynchronized: true,
  });
  await gl.makeXRCompatible();
  // A video dome needs no MSAA and no depth buffer; both cost fill-rate we
  // would otherwise pay every frame. Missing the frame deadline makes the
  // headset compositor re-project a stale frame, which reads as micro-stutter
  // (the HUD's "stale" counter was showing 1-6 per second).
  // Resolution ceiling #1: the XR framebuffer. The default scale is the
  // runtime's *recommended* size, which is well below the panel's native
  // resolution - everything we draw gets resampled down to it. Ask for the
  // native scale (and a little more when allowed) so the video's pixels
  // actually reach the display. Foveation is off: it deliberately blurs the
  // periphery, which is exactly the sharpness we are chasing.
  let fbScale = 1.0;
  try {
    const nat = XRWebGLLayer.getNativeFramebufferScaleFactor(xrSession);
    if (nat > 0) fbScale = nat * SUPERSAMPLE;
  } catch (e) {}
  // No MSAA: measured on this scene it cost the frame budget (p99 16.2ms ->
  // 41.0ms) while smoothing only the dome border and the HUD panel - the
  // picture is texture sampling, which MSAA does not affect.
  const glLayerInit = {
    antialias: false, depth: false, stencil: false, alpha: false,
    framebufferScaleFactor: fbScale,
  };
  const baseLayer = new XRWebGLLayer(xrSession, gl, glLayerInit);
  try { baseLayer.fixedFoveation = 0; } catch (e) {}   // no foveal blur
  xrSession.updateRenderState({ baseLayer });
  window.__fb = { scale: fbScale, w: baseLayer.framebufferWidth, h: baseLayer.framebufferHeight };

  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER,
    "attribute vec3 aPos; attribute vec2 aUV; uniform mat4 uMvp; varying vec2 vUV;" +
    "void main(){ vUV = aUV; gl_Position = uMvp * vec4(aPos, 1.0); }"));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER,
    "precision mediump float; varying vec2 vUV; uniform sampler2D uTex;" +
    "uniform vec2 uUvOff; uniform vec2 uUvScale; uniform float uAlpha;" +
    "void main(){ vec4 c = texture2D(uTex, uUvOff + vUV * uUvScale);" +
    "gl_FragColor = vec4(c.rgb, c.a * uAlpha); }"));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const loc = {
    pos: gl.getAttribLocation(prog, "aPos"),
    uv: gl.getAttribLocation(prog, "aUV"),
    mvp: gl.getUniformLocation(prog, "uMvp"),
    off: gl.getUniformLocation(prog, "uUvOff"),
    scale: gl.getUniformLocation(prog, "uUvScale"),
    alpha: gl.getUniformLocation(prog, "uAlpha"),
  };

  // ---- dome mesh over the stream's angular span (uv v=0 = top row) ----
  const domeVbo = gl.createBuffer(), domeIbo = gl.createBuffer();
  let domeCount = 0;
  function buildDome() {
    const R = 96, C = 192, rad = 40;
    const verts = [], idx = [];
    for (let r = 0; r <= R; r++) {
      const lat = spans.v * (0.5 - r / R);
      const cl = Math.cos(lat), sl = Math.sin(lat);
      for (let c = 0; c <= C; c++) {
        const lon = spans.h * (c / C - 0.5);
        verts.push(cl * Math.sin(lon) * rad, sl * rad, -cl * Math.cos(lon) * rad, c / C, r / R);
      }
    }
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const a = r * (C + 1) + c, b = a + C + 1;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, domeVbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, domeIbo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
    domeCount = idx.length;
  }
  buildDome();
  const spanPoll = setInterval(async () => {
    if (!xrSession) { clearInterval(spanPoll); return; }
    const s = await fetchSpans();
    if (Math.abs(s.h - spans.h) > 0.02 || Math.abs(s.v - spans.v) > 0.02) {
      spans = s;
      buildDome();
    }
  }, 5000);

  // ---- HUD quad (head-locked, center of view) ----
  const hudW = 1600, hudH = 250;
  const hudCanvas = document.createElement("canvas");
  hudCanvas.width = hudW; hudCanvas.height = hudH;
  const hctx = hudCanvas.getContext("2d");
  const hudVbo = gl.createBuffer();
  {
    const w = 1.5, h = w * hudH / hudW, z = -1.7, y = -0.02;
    gl.bindBuffer(gl.ARRAY_BUFFER, hudVbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -w/2, y - h/2, z, 0, 1,   w/2, y - h/2, z, 1, 1,
      -w/2, y + h/2, z, 0, 0,   w/2, y + h/2, z, 1, 0,
    ]), gl.STATIC_DRAW);
  }
  const mkTex = () => {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  };
  const videoTex = mkTex(), hudTex = mkTex();
  // Pre-allocate the video texture so each frame is a texSubImage2D update
  // instead of a full re-specification (which reallocates GPU storage).
  let texW = 0, texH = 0;
  function uploadFrame(src, w, h) {
    gl.bindTexture(gl.TEXTURE_2D, videoTex);
    if (w !== texW || h !== texH) {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      texW = w; texH = h;
    }
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, src);
  }

  // rolling metrics + HUD repaint
  let rafCount = 0, lastQ = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null;
  const hudTimer = setInterval(() => {
    if (!xrSession) { clearInterval(hudTimer); return; }
    live.xrFps = rafCount * 2; rafCount = 0;
    if (video.getVideoPlaybackQuality) {
      const q = video.getVideoPlaybackQuality();
      live.vidFps = (q.totalVideoFrames - lastQ.totalVideoFrames) * 2;
      live.dropPs = (q.droppedVideoFrames - lastQ.droppedVideoFrames) * 2;
      lastQ = q;
    }
    live.buf = video.buffered.length ? (video.buffered.end(video.buffered.length - 1) - video.currentTime) : 0;
    const d = live.dev || {};
    hctx.clearRect(0, 0, hudW, hudH);
    hctx.fillStyle = "rgba(10,14,20,0.72)";
    hctx.fillRect(0, 0, hudW, hudH);
    hctx.fillStyle = "#3ec3dc";
    hctx.font = "bold 42px monospace";
    // honest pipeline telemetry: what we showed, decoded, threw away for rate
    // matching (disc), and XR frames with no new frame (held)
    const line1 = wc.active
      ? `XR ${live.xrFps} shown ${wc.dispPerSec} dec ${wc.outPerSec} `
        + `disc ${wc.discPerSec} held ${wc.heldPerSec} q${wc.queue.length}+${wc.pendingDepth}`
      : `XR ${live.xrFps} video ${live.vidFps} drop ${live.dropPs}/s buf ${live.buf.toFixed(1)}s`;
    hctx.fillText(line1, 16, 60);
    hctx.fillStyle = "#e2eaf1";
    hctx.fillText(`HMD ${d.fps ?? "-"}/${d.maxFps ?? "-"}fps stale ${d.stale ?? "-"}  GPU ${d.gpuBusy ?? "-"}% ${d.gpuMHz ?? "-"}MHz`, 16, 122);
    const fb = window.__fb;
    if (window.__wcErr && /error|fail|append|decode:/i.test(window.__wcErr)) {
      hctx.fillStyle = "#ff6b6b";
      hctx.fillText(String(window.__wcErr).slice(0, 58), 16, 205);
    }
    const dim = (wc.active ? `${wc.w || "?"}x${wc.h || "?"}` : `${video.videoWidth}x${video.videoHeight}`)
      + (fb ? `  fb ${fb.w}x${fb.h} (${fb.scale.toFixed(2)}x)` : "");
    const lat = wc.active ? `  lat ${((wc.queue.length + wc.pendingDepth) / 72).toFixed(1)}s` : "";
    hctx.fillText(`CPU L${d.cpuLvl ?? "-"} ${d.cpuMHz ?? "-"}MHz  ${d.temp ?? "-"}C  ${dim}${lat}`, 16, 184);
    gl.bindTexture(gl.TEXTURE_2D, hudTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, hudCanvas);
  }, 500);

  video.play().catch(() => {});
  const headlock = () => $("headlock").checked;
  const showHud = () => $("hud").checked;

  const drawBuf = (vbo, ibo, count, mvp, uvOff, uvScale, alpha) => {
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.enableVertexAttribArray(loc.pos);
    gl.vertexAttribPointer(loc.pos, 3, gl.FLOAT, false, 20, 0);
    gl.enableVertexAttribArray(loc.uv);
    gl.vertexAttribPointer(loc.uv, 2, gl.FLOAT, false, 20, 12);
    gl.uniformMatrix4fv(loc.mvp, false, mvp);
    gl.uniform2fv(loc.off, uvOff);
    gl.uniform2fv(loc.scale, uvScale);
    gl.uniform1f(loc.alpha, alpha);
    if (ibo) {
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
      gl.drawElements(gl.TRIANGLES, count, gl.UNSIGNED_SHORT, 0);
    } else {
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, count);
    }
  };

  const viewNoTrans = new Float32Array(16);
  const onFrame = (t, frame) => {
    if (!xrSession) return;
    xrSession.requestAnimationFrame(onFrame);
    rafCount++;
    const pose = frame.getViewerPose(refSpace);
    if (!pose) return;

    // one video upload shared by both eyes: prefer the WebCodecs sideband
    // (GPU VideoFrames), fall back to the element (broken-ish on Quest)
    if (wc.active) {
      wc.pump();
      const f = wc.pick();
      if (f) {
        uploadFrame(f, f.displayWidth || wc.w, f.displayHeight || wc.h);
        try { f.close(); } catch (e) {}   // release immediately: 12.6MB per frame
      }
    } else if (video.readyState >= 2 && video.videoWidth) {
      uploadFrame(video, video.videoWidth, video.videoHeight);
    }

    const glLayer = xrSession.renderState.baseLayer;
    gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);
    gl.disable(gl.DEPTH_TEST);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE0);

    for (const view of pose.views) {
      const vp = glLayer.getViewport(view);
      gl.viewport(vp.x, vp.y, vp.width, vp.height);
      const right = view.eye === "right";

      // dome: world-fixed (rotation-only view) or hard-locked to the head
      let mvp;
      if (headlock()) {
        mvp = view.projectionMatrix;
      } else {
        viewNoTrans.set(view.transform.inverse.matrix);
        viewNoTrans[12] = viewNoTrans[13] = viewNoTrans[14] = 0;
        mvp = mat4mul(view.projectionMatrix, viewNoTrans);
      }
      gl.bindTexture(gl.TEXTURE_2D, videoTex);
      gl.disable(gl.BLEND);
      drawBuf(domeVbo, domeIbo, domeCount, mvp, right ? [0.5, 0] : [0, 0], [0.5, 1], 1.0);

      if (showHud()) {
        gl.bindTexture(gl.TEXTURE_2D, hudTex);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        drawBuf(hudVbo, null, 4, view.projectionMatrix, [0, 0], [1, 1], 0.92);
        gl.disable(gl.BLEND);
      }
    }
  };
  xrSession.requestAnimationFrame(onFrame);
}

// ---------------------------------------------------------------- stats
setInterval(async () => {
  if (pc && pc.connectionState === "connected") {
    const st = await pc.getStats();
    let fps = 0, w = 0, h = 0, kbps = 0;
    st.forEach((r) => {
      if (r.type === "inbound-rtp" && r.kind === "video") {
        fps = r.framesPerSecond || 0;
        w = r.frameWidth || 0; h = r.frameHeight || 0;
        kbps = Math.round(((r.bytesReceived - (window._pb || 0)) * 8) / 1000);
        window._pb = r.bytesReceived;
      }
    });
    $("stats").textContent = `WebRTC · ${w}x${h} @ ${fps}fps · ${kbps} kbit/s`;
  } else if (wc.active) {
    $("stats").textContent = `Direct decode · ${wc.w || "?"}x${wc.h || "?"} · shown ${wc.dispPerSec}/s`
      + ` · dec ${wc.outPerSec}/s · discarded ${wc.discPerSec}/s · held ${wc.heldPerSec}/s`
      + ` · latency ${((wc.queue.length + wc.pendingDepth) / 72).toFixed(1)}s`;
  } else if (hls && video.videoWidth) {
    const q = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null;
    $("stats").textContent = `Buffered · ${video.videoWidth}x${video.videoHeight}`
      + (q ? ` · frames ${q.totalVideoFrames} (dropped ${q.droppedVideoFrames})` : "");
  } else {
    $("stats").textContent = "";
  }
}, 1000);

// On-device decoder probes (Media Capabilities API): can the buffered path
// hardware-decode the max-resolution stream on this device?
(async () => {
  try {
    if (!navigator.mediaCapabilities || !navigator.mediaCapabilities.decodingInfo) return;
    const q = async (type, contentType) => {
      try {
        const r = await navigator.mediaCapabilities.decodingInfo({
          type,
          video: { contentType, width: 6144, height: 3072, framerate: 72, bitrate: 150000000 },
        });
        return r.supported ? (r.powerEfficient ? "hardware ✓" : "software (slow)") : "unsupported";
      } catch (e) { return "unknown"; }
    };
    const hevc = await q("media-source", 'video/mp4; codecs="hvc1.1.6.L183.B0"');
    const av1  = await q("media-source", 'video/mp4; codecs="av01.0.17M.08"');
    $("cap").textContent = `Buffered 6144x3072@72 decode — HEVC: ${hevc} · AV1: ${av1}`;
  } catch (e) { /* probe unavailable; ignore */ }
})();

// "Prefer delaying over skipping": raise the WebRTC jitter-buffer target so
// late frames wait in the buffer instead of being dropped. Combined with the
// USB path's TCP transport (lossless), hiccups become latency, not skips.
const DELAY_TARGET_MS = 1500;
// Framebuffer supersample on top of the native scale. 1.0 = native panel
// pixels; >1 renders larger and lets the compositor downsample (sharper edges,
// more fill rate). Overridable with ?ss=1.25 for experiments.
// 1.6 asks for more than the runtime will give: the framebuffer clamps at
// 6144x4399 (3072 px per eye), which is exactly 1:1 with the 6144x3072 stream.
// Anything above ~1.5 lands on that same ceiling - measured identical at 1.5,
// 1.6, 1.8 and 2.0 - so this is the maximum the headset can display.
// At 150 Mbps it is also the best measured pacing: 800 frames at p99 15.6ms,
// max 16.9ms, 0 frames over 25ms, 0 stale, GPU 33%. (An earlier test called
// 1.6 too heavy, but that was at 240 Mbps, where decoding competed with the
// GPU for memory bandwidth.)
const SUPERSAMPLE = Math.min(2.0, Math.max(0.8,
  parseFloat(new URLSearchParams(location.search).get("ss")) || 1.6));
function applyDelayPref() {
  if (!pc) return;
  const target = $("delaypref").checked ? DELAY_TARGET_MS : 0;
  for (const r of pc.getReceivers()) {
    try { r.jitterBufferTarget = target; } catch (e) {}
    try { r.playoutDelayHint = target / 1000; } catch (e) {}   // older Chromium name
  }
}
$("delaypref").addEventListener("change", applyDelayPref);

// "Full picture" toggles the PC-side edge feather via the /settings bridge.
const FEATHER_DEFAULT = 1.5;
async function pushFullpic() {
  try {
    await fetch(new URL("/settings", location.href), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ feather: $("fullpic").checked ? 0 : FEATHER_DEFAULT }),
    });
  } catch (e) {}
}
$("fullpic").addEventListener("change", pushFullpic);
fetch(new URL("/settings", location.href)).then((r) => r.json()).then((s) => {
  if (typeof s.feather === "number") $("fullpic").checked = s.feather === 0;
}).catch(() => {});

// Launcher-app presets: ?auto=1&headlock=0|1&muted=0|1&fullpic=0|1 (set by the Quest APK)
{
  const q = new URLSearchParams(location.search);
  if (q.has("headlock")) $("headlock").checked = q.get("headlock") === "1";
  if (q.has("muted")) {
    $("muted").checked = q.get("muted") !== "0";
    video.muted = $("muted").checked;
  }
  if (q.has("fullpic")) {
    $("fullpic").checked = q.get("fullpic") === "1";
    pushFullpic();
  }
  if (q.has("delay")) $("delaypref").checked = q.get("delay") === "1";
  if (q.get("auto") === "1") setTimeout(() => $("connect").click(), 400);
}

window.addEventListener("beforeunload", () => {
  if (whepLocation) navigator.sendBeacon && fetch(whepLocation, { method: "DELETE", keepalive: true }).catch(() => {});
});
</script>
</body>

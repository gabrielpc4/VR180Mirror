# MediaMTX config for VR180Mirror (USB-only pipeline)
# Ingest:  OBS publishes RTMP to  rtmp://127.0.0.1:1936/vr180
# Output:  LL-HLS  http://127.0.0.1:9888/vr180/index.m3u8  (proxied by web/server.js
#          on :9080, reached over the adb-reverse USB tunnel)
# WebRTC/WHIP/WHEP and SRT are disabled: the spectator viewer only uses the
# buffered LL-HLS + WebCodecs path over USB now.

logLevel: info
# visible console + log file (close the window and the launcher restarts it next run)
logDestinations: [stdout, file]
logFile: mediamtx.log

# local-only control API - used by Start-Spectator.ps1 to health-check ingest
api: true
apiAddress: 127.0.0.1:9998
# RTSP on a private port: frame-exact local pulls for diagnostics
rtsp: true
rtspAddress: 127.0.0.1:9554
rtspTransports: [tcp]
# RTMP ingest (TCP): lossless on loopback. UDP transports (WHIP/SRT) were
# dropping packets at 120-150 Mbps - corrupt slices and missing keyframes.
rtmp: true
rtmpAddress: 127.0.0.1:1936
rtmpEncryption: "no"
srt: false
moq: false
playback: false
metrics: false
pprof: false
webrtc: false

hls: true
hlsAddress: :9888
hlsEncryption: false
hlsAllowOrigins: ["*"]
hlsVariant: lowLatency
# 150 Mbps means a 1s segment is ~19MB and a keyframe-heavy scene can spike
# well past MediaMTX's 50MB default, which crashed the muxer
hlsSegmentMaxSize: 250M
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAlwaysRemux: true

paths:
  vr180:
    source: publisher


# MediaMTX config for VR180Mirror
# Ingest:  OBS publishes WHIP (WebRTC) to http://127.0.0.1:9889/vr180/whip
# Outputs: WHEP (WebRTC)  http://127.0.0.1:9889/vr180/whep  (proxied by web/server.js on :8443)
#          LL-HLS         http://<lan-ip>:9888/vr180/index.m3u8  (DeoVR fallback)
# Ports chosen to coexist with any other streaming stack on this PC
# (8889/8189/8554/1935/8080 are left alone).

logLevel: info
# visible console + log file (close the window and the launcher restarts it next run)
logDestinations: [stdout, file]
logFile: mediamtx.log

# large socket buffer: the local WHIP publisher bursts RTP packets; avoid drops
udpReadBufferSize: 4194304

# local-only control API - used by Start-Spectator.ps1 to health-check ingest
api: true
apiAddress: 127.0.0.1:9998
# RTSP on a private port: frame-exact local pulls for diagnostics
rtsp: true
rtspAddress: 127.0.0.1:9554
rtspTransports: [tcp]
rtmp: false
# SRT ingest from OBS: reliable on loopback (recovers lost packets), unlike
# WHIP's plain UDP which dropped RTP under 150 Mbps keyframe bursts
srt: true
srtAddress: :9890
moq: false
playback: false
metrics: false
pprof: false

webrtc: true
# bound on all interfaces so the Quest can also use MediaMTX's built-in page
# (http://<lan-ip>:9889/vr180) with the browser's fullscreen 180/3D mode
webrtcAddress: :9889
webrtcEncryption: false
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :9189
# ICE over TCP on the same port: lets the USB-cable spectator route WebRTC
# media through an adb-reverse tunnel (Quest -> localhost -> PC), bypassing Wi-Fi
webrtcLocalTCPAddress: :9189
# Advertise loopback (for local OBS publisher) + the LAN IP (for the Quest).
# Start-Spectator.ps1 rewrites the LAN entry to the current address on launch.
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1, 192.168.15.37]

hls: true
hlsAddress: :9888
hlsEncryption: false
hlsAllowOrigins: ["*"]
hlsVariant: lowLatency
# 150 Mbps means a 1s segment is ~19MB and a keyframe-heavy scene can spike
# well past MediaMTX's 50MB default, which crashed the muxer
hlsSegmentMaxSize: 250M
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAlwaysRemux: true

paths:
  vr180:
    source: publisher

